<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lem Business - የኢንቨስትመንት ፕላትፎርም</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background: #10b981; color: white; }
        .btn-reg { background: #3b82f6; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Lem Business</h2>
        <div id="auth-box">
            <input type="email" id="email" placeholder="ኢሜይል (Email)">
            <input type="password" id="password" placeholder="የምስጢር ቃል (Password)">
            <button onclick="handleLogin()">ግበሩ (Login)</button>
            <button class="btn-reg" onclick="handleRegister()">አዲስ መለያ ፍጠሩ (Register)</button>
        </div>

        <div id="dash-box" class="hidden">
            <h3>እንኳን ደህና መጡ!</h3>
            <p>ዳሽቦርድዎ ላይ ተሳክተዋል።</p>
            <button onclick="location.reload()">ውጣ</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhlrrdoxanlctkbzmtzd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9EJwLWhS982bWPz0ZJ9Z1A_9EJwLWhS982bWPz0ZJ9Z1A';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                alert('እባክዎን ኢሜይል እና የይለፍ ቃል ይሙሉ!');
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('ስህተት: ' + error.message);
            } else {
                alert('ምዝገባው ተሳክቷል!');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                alert('እባክዎን ኢሜይል እና የይለፍ ቃል ይሙሉ!');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('መግባት አልተቻለም: ' + error.message);
            } else {
                alert('በተሳካ ሁኔታ ገብተዋል!');
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('dash-box').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
